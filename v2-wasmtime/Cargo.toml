[package]
name = "alcohol"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde_json = "1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = "0.0.8"
h3-quinn = "0.0.9"
h3-webtransport = "0.1"
wtransport = { version = "0.6", default-features = false, features = ["ring", "quinn", "dangerous-configuration"] }
http = "1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures = "0.3"
wasmtime-internal-fiber = { version = "50.0.2", features = ["std"] }
wasmtime = { version = "50.0.2", features = ["winch"] }
x11rb = { version = "0.14.0", features = ["allow-unsafe-code"] }
khronos-egl = { version = "6.0.0", features = ["dynamic"] }
cpal = "0.18.2"
x11-dl = "2.21.0"
libloading = "0.8"
wgpu = { version = "30.0.2", default-features = false, features = ["gles", "vulkan", "wgsl"] }
raw-window-handle = "0.6.2"
tungstenite = "0.30.0"
shiguredo_http3 = "2026.1.0-canary.16"
url = "2"

[patch.crates-io]
# 3-line leniency patch: the module has 4-aligned 64-bit atomics and only runs
# because Chromium does not enforce natural alignment for atomics.
wasmtime-internal-cranelift = { path = "../vendor/wasmtime-internal-cranelift" }
wasmtime-internal-fiber = { path = "../vendor/wasmtime-internal-fiber" }
