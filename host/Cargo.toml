[package]
name = "gen-vmctx-offsets"
version = "0.1.0"
edition = "2024"
publish = false

# Prints a C header of VMContext / VMStoreContext / builtin offsets derived
# from wasmtime-environ 50.0.2's own VMOffsets implementation. Used only at
# development time; the C++ host itself has no Rust dependency.

[[bin]]
name = "gen_vmctx"
path = "gen_vmctx.rs"

[dependencies]
anyhow = "1"
wasmparser = { version = "=0.261.0", default-features = false, features = ["features", "validate", "simd"] }
wasmtime-environ = { version = "=50.0.2", default-features = false, features = ["std", "compile", "threads", "component-model", "gc-drc", "gc-null", "gc-copying", "stack-switching"] }
wasmtime-internal-core = { version = "=50.0.2", features = ["std", "anyhow"] }
