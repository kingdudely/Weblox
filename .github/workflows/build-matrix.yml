name: build-matrix

# Prebuild the wasm2c engine library for Linux, macOS and Windows.
# This is a pure builder: no version resolution, no host logic.

on:
  workflow_dispatch:
    inputs:
      generated-release:
        description: 'Release holding generated WC*.c'
        required: false
        default: ci-local-wasm2c-generated
        type: string
      opt:
        description: 'optimisation level'
        required: false
        default: O0
        type: string
      os:
        description: 'single runner to build (blank = all three)'
        required: false
        default: ''
        type: string
      timeout-minutes:
        description: 'job timeout'
        required: false
        default: '360'
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(grep '^WASM_VERSION=' tools/ci/pins.env | cut -d= -f2)
          case "$tag" in version-*) ;; *) tag="version-$tag-RobloxWebClient" ;; esac
          if ! gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$tag" --repo "${{ github.repository }}" \
              --title "Engine $tag" \
              --notes "Prebuilt wasm2c engine libraries for Linux/macOS/Windows." \
              --target "${{ github.sha }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.os && fromJSON(format('["{0}"]', inputs.os)) || fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ fromJSON(inputs.timeout-minutes || '360') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          if ! command -v clang >/dev/null 2>&1; then
            choco install llvm -y
          fi
          if ! command -v zstd >/dev/null 2>&1; then
            if [ "${{ runner.os }}" = "Windows" ]; then choco install zstd -y
            elif [ "${{ runner.os }}" = "macOS" ]; then brew install zstd
            else sudo apt-get update -qq && sudo apt-get install -y -qq zstd
            fi
          fi
          clang --version | head -1
          zstd --version | head -1

      - name: Prepare
        run: mkdir -p build/ci

      - name: Build engine library
        id: run
        env:
          GENERATED_RELEASE: ${{ inputs.generated-release }}
          WC_OPT: ${{ inputs.opt }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if /usr/bin/time -v true 2>/dev/null; then
            /usr/bin/time -v -o build/ci/time.txt bash tools/ci/compile-generated.sh 2>&1 | tee build/ci/run.log
          else
            bash tools/ci/compile-generated.sh 2>&1 | tee build/ci/run.log
          fi
          echo "dir=$(cat build/ci/engine_dir)" >> "$GITHUB_OUTPUT"

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-${{ matrix.os }}-${{ github.run_id }}
          path: |
            build/ci/metrics.json
            build/ci/run.log
          if-no-files-found: warn

      - name: Publish assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENGINE_DIR: ${{ steps.run.outputs.dir }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            "$ENGINE_DIR"/engine-*.zst \
            "$ENGINE_DIR"/WC.h --repo "${{ github.repository }}" --clobber

  source:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build portable source bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p gen
          gh release download ci-local-wasm2c-generated --repo "${{ github.repository }}" \
            --dir gen --pattern 'WC*.c' --pattern 'WC.h' --pattern 'WC-impl.h'
          tar --zstd -cf generated-c.tar.zst -C gen .
          gh release upload "$TAG" generated-c.tar.zst gen/WC.h \
            --repo "${{ github.repository }}" --clobber
